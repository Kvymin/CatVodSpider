name: Build CatVodSpider codex/java-wasm-integration
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: Kvymin/CatVodSpider
          ref: codex/java-wasm-integration
          fetch-depth: 0

      - name: Debug print files
        run: |
          pwd
          ls -la
          find . -name pom.xml

      - name: Setup JDK 17 Temurin
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # 重点：这里完全删掉 cache 行！！

      - name: Maven package
        run: mvn clean package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider
          path: target/custom_spider.jar
