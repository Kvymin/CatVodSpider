name: Build CatVodSpider codex/java-wasm-integration
on:
  workflow_dispatch: # 只能手动点运行，最稳

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream repository directly
        uses: actions/checkout@v4
        with:
          repository: Kvymin/CatVodSpider
          ref: codex/java-wasm-integration
          fetch-depth: 0

      - name: Debug - list all files
        run: |
          echo "==== 当前工作目录 ===="
          pwd
          echo "==== 文件列表 ===="
          ls -la
          echo "==== 查找pom.xml ===="
          find . -name pom.xml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: none # 彻底关闭自动扫描pom的缓存，杜绝该报错

      - name: Maven build package
        run: mvn clean package -DskipTests

      - name: Upload custom_spider.jar
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider
          path: target/custom_spider.jar
